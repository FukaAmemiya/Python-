name: Windows EXE build and SignPath Release

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'novel_*.py'
      - 'requirements_novel.txt'
      - 'test_novel_*.py'
      - '.github/workflows/windows-release.yml'
      - 'CODE_SIGNING.md'
      - 'build_version_info.py'
      - '.signpath/artifact-configuration.xml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'New signed release tag, for example v1.1.1'
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      unsigned_artifact_id: ${{ steps.unsigned_upload.outputs.artifact-id }}
      pe_version: ${{ steps.version.outputs.pe_version }}
    env:
      EXE_NAME: NovelDownloader-Windows-x64.exe
    steps:
      - name: Require main branch and a valid tag for a release
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_REF -ne 'refs/heads/main') {
            throw 'Signed releases must be dispatched from the main branch.'
          }
          if ($env:RELEASE_TAG -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw 'Release tag must look like v1.1.1.'
          }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application and packager
        run: python -m pip install -r requirements_novel.txt "pyinstaller>=6.15,<7"
      - name: Run core and bookshelf regression tests
        run: python -m unittest -v test_novel_downloader test_novel_web test_novel_library test_signpath_config
      - name: Create Windows version metadata
        id: version
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          $tag = $env:REQUESTED_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = 'v0.0.0' }
          python build_version_info.py --tag "$tag" --output win-version-info.txt
          if ($LASTEXITCODE -ne 0) { throw 'Version metadata generation failed.' }
          "pe_version=$($tag.TrimStart('v')).0" >> $env:GITHUB_OUTPUT
      - name: Build standalone Windows GUI executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name NovelDownloader-Windows-x64 --version-file win-version-info.txt novel_downloader.py
      - name: Verify EXE product metadata
        shell: pwsh
        run: |
          $info = (Get-Item ".\dist\$env:EXE_NAME").VersionInfo
          if ($info.ProductName -ne '双站小说下载器 (FukaAmemiya)') { throw "Wrong product name $($info.ProductName)" }
          if ($info.ProductVersion -ne '${{ steps.version.outputs.pe_version }}') { throw "Wrong product version $($info.ProductVersion)" }
      - name: Smoke-test frozen executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\dist\$env:EXE_NAME" -ArgumentList @("--self-test", "bundle-smoke.txt") -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Test-Path "bundle-smoke.txt")) {
            throw 'The packaged executable failed to start or import its components.'
          }
          if ((Get-Content "bundle-smoke.txt" -Raw).Trim() -ne 'bundle-ok') {
            throw 'The packaged executable returned an invalid smoke test result.'
          }
      # PR/push artifacts are deliberately unsigned. Never publish them as a Release.
      - name: Upload unsigned preview for build verification
        id: unsigned_upload
        uses: actions/upload-artifact@v4
        with:
          name: NovelDownloader-unsigned-preview
          path: dist/NovelDownloader-Windows-x64.exe
          if-no-files-found: error
          retention-days: 7

signed-release:
    name: SignPath approve, sign, verify and publish
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: windows-exe
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      EXE_NAME: NovelDownloader-Windows-x64.exe
    steps:
      - uses: actions/checkout@v4

      - name: Require SignPath approval configuration and unused release version
        shell: pwsh
        env:
          SIGNPATH_ORG: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          SIGNPATH_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          foreach ($key in @('SIGNPATH_ORG', 'SIGNPATH_PROJECT', 'SIGNPATH_POLICY',
                             'SIGNPATH_ARTIFACT', 'SIGNPATH_TOKEN')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($key))) {
              throw "Missing $key. No unsigned Release will be published."
            }
          }
          gh release view "$env:RELEASE_TAG" --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $env:RELEASE_TAG already exists."
          }
          $existingTag = git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Remote tag check failed.' }
          if ($existingTag) { throw "Git tag $env:RELEASE_TAG already exists." }

      - name: Submit official GitHub artifact for SignPath Foundation signing
        id: sign
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.windows-exe.outputs.unsigned_artifact_id }}
          wait-for-completion: 'true'
          wait-for-completion-timeout-in-seconds: '5400'
          output-artifact-directory: ${{ github.workspace }}\signed
          parameters: |
            version: "${{ needs.windows-exe.outputs.pe_version }}"

      - name: Verify Windows-trusted Authenticode signature and timestamp
        shell: pwsh
        run: |
          $file = (Resolve-Path ".\signed\$env:EXE_NAME").Path
          $signature = Get-AuthenticodeSignature -FilePath $file
          if ($signature.Status -ne 'Valid' -or $null -eq $signature.SignerCertificate) {
            throw "Signature invalid or untrusted: $($signature.Status)"
          }
          if ($signature.SignerCertificate.Subject -notmatch 'SignPath Foundation') {
            throw "Unexpected publisher: $($signature.SignerCertificate.Subject)"
          }
          if ($null -eq $signature.TimeStamperCertificate) {
            throw 'Signed EXE has no trusted timestamp.'
          }
          $sdkRoot = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Windows Kits\10\bin'
          $signTool = Get-ChildItem $sdkRoot -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $signTool) { throw 'Windows SDK SignTool unavailable.' }
          & $signTool.FullName verify /pa /v /tw $file
          if ($LASTEXITCODE -ne 0) { throw 'Authenticode verification failed.' }

      - name: Generate final signed EXE checksums and release notes
        shell: pwsh
        run: |
          $hash = (Get-FileHash ".\signed\$env:EXE_NAME" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:EXE_NAME" | Out-File '.\signed\SHA256SUMS.txt' -Encoding ascii
          @(
            "# $env:RELEASE_TAG - Windows signed release",
            "",
            "Free code signing provided by SignPath.io, certificate by SignPath Foundation.",
            "",
            "Code signing policy: https://github.com/FukaAmemiya/Python-/blob/main/CODE_SIGNING.md",
            "Privacy policy: https://github.com/FukaAmemiya/Python-/blob/main/PRIVACY.md",
            "",
            "Windows x64 standalone desktop EXE with bookshelf, TXT/EPUB export and resume.",
            "SHA256SUMS.txt corresponds to the final signed executable.",
            "Code signing does not guarantee SmartScreen reputation."
          ) | Set-Content 'SIGNED_RELEASE_NOTES.md' -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: NovelDownloader-Windows-x64-signed
          path: |
            signed/NovelDownloader-Windows-x64.exe
            signed/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish only verified SignPath signed GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:RELEASE_TAG" ".\signed\$env:EXE_NAME" ".\signed\SHA256SUMS.txt" --target "$env:GITHUB_SHA" --title "$env:RELEASE_TAG - SignPath Foundation signed" --notes-file 'SIGNED_RELEASE_NOTES.md' --latest
          if ($LASTEXITCODE -ne 0) { throw 'Signed release publication failed.' }
