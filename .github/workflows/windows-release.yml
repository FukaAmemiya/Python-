name: Windows EXE build and signed Release

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'novel_*.py'
      - 'requirements_novel.txt'
      - 'test_novel_*.py'
      - '.github/workflows/windows-release.yml'
      - 'CODE_SIGNING.md'
  workflow_dispatch:
    inputs:
      tag:
        description: 'New signed release tag, for example v1.1.1'
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      EXE_NAME: NovelDownloader-Windows-x64.exe
    steps:
      - name: Require main branch and a valid tag for a release
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_REF -ne 'refs/heads/main') {
            throw 'Signed releases must be dispatched from the main branch.'
          }
          if ($env:RELEASE_TAG -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw 'Release tag must look like v1.1.1.'
          }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application and packager
        run: python -m pip install -r requirements_novel.txt "pyinstaller>=6.15,<7"
      - name: Run core and bookshelf regression tests
        run: python -m unittest -v test_novel_downloader test_novel_web test_novel_library
      - name: Build standalone Windows GUI executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name NovelDownloader-Windows-x64 novel_downloader.py
      - name: Smoke-test frozen executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\dist\$env:EXE_NAME" -ArgumentList @("--self-test", "bundle-smoke.txt") -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Test-Path "bundle-smoke.txt")) {
            throw 'The packaged executable failed to start or import its components.'
          }
          if ((Get-Content "bundle-smoke.txt" -Raw).Trim() -ne 'bundle-ok') {
            throw 'The packaged executable returned an invalid smoke test result.'
          }
      # PR/push artifacts are deliberately unsigned. Never publish them as a Release.
      - name: Upload unsigned preview for build verification
        uses: actions/upload-artifact@v4
        with:
          name: NovelDownloader-unsigned-preview
          path: dist/NovelDownloader-Windows-x64.exe
          if-no-files-found: error
          retention-days: 7

  signed-release:
    name: Sign, verify and publish
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: windows-exe
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      EXE_NAME: NovelDownloader-Windows-x64.exe
    steps:
      - uses: actions/checkout@v4
      - name: Download the executable built in this same workflow run
        uses: actions/download-artifact@v4
        with:
          name: NovelDownloader-unsigned-preview
          path: dist

      - name: Validate signing service configuration
        shell: pwsh
        env:
          SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          foreach ($key in @(
            'SIGNING_ENDPOINT', 'SIGNING_ACCOUNT', 'SIGNING_PROFILE',
            'AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID'
          )) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($key))) {
              throw "Missing signing configuration: $key. No unsigned Release will be created."
            }
          }
          if ($env:SIGNING_ENDPOINT -notmatch '^https://[a-z0-9-]+\.codesigning\.azure\.net/?$') {
            throw 'AZURE_SIGNING_ENDPOINT must be an Artifact Signing service endpoint.'
          }
          gh release view "$env:RELEASE_TAG" --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $env:RELEASE_TAG already exists; refusing to replace it."
          }
          $existingTag = git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to check remote release tags; refusing to publish.'
          }
          if ($existingTag) {
            throw "Git tag $env:RELEASE_TAG already exists on origin; refusing to reuse it."
          }

      # Use GitHub OIDC federation; no private key, PFX, or Azure client secret
      # is stored in the source repository or uploaded as a build artifact.
      - name: Authenticate to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticode sign with Azure Artifact Signing
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify trusted signature and trusted timestamp
        shell: pwsh
        run: |
          $file = (Resolve-Path ".\dist\$env:EXE_NAME").Path
          $signature = Get-AuthenticodeSignature -FilePath $file
          if ($signature.Status -ne 'Valid' -or $null -eq $signature.SignerCertificate) {
            throw "Signature is not trusted: $($signature.Status). Refusing publication."
          }
          if ($null -eq $signature.TimeStamperCertificate) {
            throw 'No trusted timestamp was found. Refusing publication.'
          }
          $sdkRoot = Join-Path "${env:ProgramFiles(x86)}" 'Windows Kits\10\bin'
          $signTool = Get-ChildItem $sdkRoot -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $signTool) {
            throw 'Windows SDK SignTool was not found.'
          }
          & $signTool.FullName verify /pa /v /tw $file
          if ($LASTEXITCODE -ne 0) {
            throw 'Windows SignTool signature verification failed.'
          }
          "Verified publisher: $($signature.SignerCertificate.Subject)"
          "Timestamp authority: $($signature.TimeStamperCertificate.Subject)"

      # Hash after signing: Authenticode changes the EXE bytes.
      - name: Create signed SHA-256 manifest and release notes
        shell: pwsh
        run: |
          $exePath = ".\dist\$env:EXE_NAME"
          $hash = (Get-FileHash $exePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:EXE_NAME" | Out-File ".\dist\SHA256SUMS.txt" -Encoding ascii
          $publisher = (Get-AuthenticodeSignature $exePath).SignerCertificate.Subject
          @(
            "# $env:RELEASE_TAG · Windows Authenticode signed release",
            "",
            "Built from the official main branch and signed by Azure Artifact Signing.",
            "Publisher certificate subject: $publisher",
            "",
            "Includes Windows x64 standalone GUI, bookshelf, TXT/EPUB export and resumable downloads.",
            "",
            "The EXE is verified using Windows Authenticode and an RFC 3161 timestamp.",
            "SHA256SUMS.txt contains the digest of the final, signed EXE.",
            "Code signing does not guarantee an immediate absence of SmartScreen warnings."
          ) | Set-Content -Path "SIGNED_RELEASE_NOTES.md" -Encoding utf8

      - name: Upload verified signed binary as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovelDownloader-Windows-x64-signed
          path: |
            dist/NovelDownloader-Windows-x64.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish signed GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:RELEASE_TAG" ".\dist\$env:EXE_NAME" ".\dist\SHA256SUMS.txt" --target "$env:GITHUB_SHA" --title "$env:RELEASE_TAG · Windows 已签名版" --notes-file "SIGNED_RELEASE_NOTES.md" --latest
          if ($LASTEXITCODE -ne 0) {
            throw 'Creating the signed GitHub Release failed.'
          }
